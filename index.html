<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام إدارة ساعات المولدات والمصاريف - إصدار مطوّر</title>

  <style>
    :root{
      --bg:#f4f5f7;
      --card:#ffffff;
      --border:#e5e7eb;
      --muted:#6b7280;
      --primary:#111827;
      --safe:#22c55e;
      --soon:#f97316;
      --due:#ef4444;
      --radius:14px;
    }

    *{box-sizing:border-box;font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif}

    body{
      margin:0;
      background:var(--bg);
      color:#111827;
    }

    /* ==================== الهيدر الجديد ==================== */

    header{
      position:sticky;
      top:0;
      z-index:20;
      background:#fff;
      border-bottom:1px solid var(--border);
      padding:12px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .header-right{
      display:flex;
      align-items:center;
      justify-content:flex-start;
    }

    .brand-logo{
      height:55px;
      width:auto;
      display:block;
    }

    .header-center{
      text-align:center;
      flex-grow:1;
      margin-right:20px;
      margin-left:20px;
    }

    .header-center h1{
      margin:0;
      font-size:18px;
      line-height:1.3;
      white-space:nowrap;
    }

    .header-center h1 span{
      font-size:11px;
      color:var(--muted);
      display:block;
    }

    /* ======================================================== */

    .header-actions{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      justify-content:flex-end;
      min-width:280px;
    }

    button{
      border-radius:999px;
      border:1px solid var(--border);
      padding:8px 14px;
      background:#fff;
      cursor:pointer;
      font-size:13px;
      display:inline-flex;
      align-items:center;
      gap:6px;
    }
    button:hover{
      background:#f9fafb;
    }
    .btn-primary{
      background:var(--primary);
      color:#fff;
      border-color:var(--primary);
    }
    .btn-primary:hover{
      background:#020617;
    }
    .btn-danger{
      color:#b91c1c;
      border-color:#fecaca;
      background:#fef2f2;
    }

    /* بقية CSS النظام الأصلي كما هو بدون تعديل */
    .login-wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--bg);
      padding:16px;
    }
    .login-card{
      background:#fff;
      border-radius:var(--radius);
      padding:22px 20px 20px;
      max-width:360px;
      width:100%;
      border:1px solid var(--border);
      box-shadow:0 10px 25px rgba(15,23,42,.12);
    }
    .login-card h2{
      margin:0 0 4px;
      font-size:18px;
    }
    .login-card p{
      margin:0 0 14px;
      font-size:12px;
      color:var(--muted);
    }
    #login-error{
      margin-top:8px;
      font-size:12px;
      color:#b91c1c;
      display:none;
    }
    .logout-btn{
      font-size:11px;
      padding:5px 10px;
    }

    main{
      padding:16px 20px 40px;
      display:grid;
      grid-template-columns:320px minmax(0, 2.2fr) minmax(0, 1.6fr);
      gap:16px;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      border:1px solid var(--border);
      padding:14px 14px 16px;
      box-shadow:0 1px 0 rgba(15,23,42,.03);
    }
    .card h2{
      margin:0 0 10px;
      font-size:15px;
    }
    .card h3{
      margin:12px 0 8px;
      font-size:14px;
    }

    label{
      font-size:12px;
      color:#374151;
      font-weight:600;
    }
    label small{
      font-weight:400;
      color:var(--muted);
    }

    input, select{
      width:100%;
      padding:9px 10px;
      border-radius:10px;
      border:1px solid var(--border);
      font-size:13px;
      margin-top:4px;
      background:#fff;
      transition:border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus{
      outline:none;
      border-color:#94a3b8;
      box-shadow:0 0 0 3px rgba(148,163,184,.28);
    }

    .field{
      display:flex;
      flex-direction:column;
      margin-bottom:8px;
    }

    .gen-list{
      list-style:none;
      padding:0;
      margin:8px 0 0;
      max-height:420px;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .gen-item{
      border-radius:12px;
      border:1px solid var(--border);
      padding:8px 10px;
      cursor:pointer;
      background:#fff;
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .gen-item.active{
      border-color:#4b5563;
      box-shadow:0 0 0 2px rgba(148,163,184,.35);
      background:#f9fafb;
    }
    .gen-item-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:6px;
    }
    .gen-name{
      font-size:13px;
      font-weight:600;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* كل بقية CSS بقي كما هو من ملفك الأصلي */

  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div id="login-screen" class="login-wrap">
    <form id="login-form" class="login-card">
      <h2>تسجيل الدخول</h2>
      <p>أدخل اسم المستخدم وكلمة المرور للدخول للنظام.</p>
      <div class="field">
        <label>اسم المستخدم</label>
        <input id="login-username" autocomplete="username" placeholder="Sameer أو Jabbar">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••">
      </div>
      <button class="btn-primary" type="submit" style="width:100%;margin-top:6px;">دخول</button>
      <div id="login-error"></div>
      <p style="margin-top:10px;font-size:11px;color:#6b7280;">
        حسابات افتراضية للتجربة: Sameer / Sameer1234 – Jabbar / 1234
      </p>
    </form>
  </div>

  <!-- التطبيق الرئيسي -->
  <div id="app" style="display:none;">

    <!-- =================== الهيدر الجديد =================== -->
    <header>

      <div class="header-right">
        <img src="Logo.jpg" alt="شعار الشركة" class="brand-logo">
      </div>

      <div class="header-center">
        <h1>
          نظام إدارة ساعات تشغيل المولدات والمصاريف
          <span>Nafithat Al-Amal</span>
        </h1>
      </div>

      <div class="header-actions">
        <button id="export-json">تصدير JSON</button>

        <label id="import-json-wrapper" style="font-size:12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;">
          استيراد JSON
          <input type="file" id="import-json" accept="application/json" style="display:none">
        </label>

        <button id="save-local">حفظ البيانات</button>
        <button id="export-csv" title="ملخص CSV بسيط لجميع المولدات">ملخص CSV</button>

        <span class="muted">المستخدم: <strong id="current-user-label">-</strong></span>
        <button id="logout-btn" class="logout-btn">تسجيل خروج</button>
      </div>

    </header>
    <!-- ================================================== -->

    <!-- الباقي من الكود يبقى تماما كما أرسلته أنت (نظام القراءات والمولدات) -->
    <!-- ………………………………………………………………………………………………… -->
    <!-- ………………………………………………………………………………………………… -->
    <!-- الكود كامل موجود عندك أساساً ولم أحذفه حفاظاً على المساحة هنا -->
    <!-- إذا تريد سأرسل الصفحة كاملة جدا جدا بدون اختصار -->

  </div>

<script>
/* كل سكربت JavaScript عندك سيتم وضعه هنا بدون أي تعديل */
</script>

</body>
</html>
